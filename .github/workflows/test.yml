name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore SGH.sln

      - name: Compilar solución
        run: dotnet build SGH.sln -c Release --no-restore

      - name: Ejecutar pruebas y generar TRX
        run: dotnet test SGH.sln -c Release --no-build --logger "trx;LogFileName=test_results.trx" --results-directory .github/TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .github/TestResults/test_results.trx

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: .github/TestResults/test_results.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Ejecutar pruebas y mostrar Cobertura en consola
        run: |
          dotnet test SGH.sln -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=json \
            /p:CoverletOutput="${{ github.workspace }}/TestResults/"